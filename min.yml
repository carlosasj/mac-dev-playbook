---
- name: Configure host.
  hosts: all

  vars_files:
    - config.min.yml

  roles:
    - role: elliotweiser.osx-command-line-tools

    - role: geerlingguy.mac.homebrew
      tags: ['homebrew']

    - role: gantsign.oh-my-zsh
      tags: ['dotfiles', 'once-in-a-blue-moon']
      oh_my_zsh_write_zshrc: false
      users:
        - username: 'schneider'

    - role: geerlingguy.mac.mas
      when: mas_installed_apps
      tags: ['mas']

  tasks:
    - command: xcodebuild -license accept
      become: true
      tags: ['mas']

    - import_tasks: tasks/sudo-fingerprint.yml
      when: configure_sudo_fingerprint
      tags: ['sudo-fingerprint', 'once-in-a-blue-moon']

    - import_tasks: tasks/sudoers.yml
      when: configure_sudoers
      tags: ['sudoers']

    - import_tasks: tasks/terminal.yml
      when: configure_terminal
      tags: ['terminal', 'once-in-a-blue-moon']

    - import_tasks: tasks/oh-my-zsh-theme.yml
      when: configure_terminal
      tags: ['terminal']

    - import_tasks: tasks/vundle.yml
      tags: ['vundle', 'once-in-a-blue-moon']

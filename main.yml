---
- name: Configure host.
  hosts: all

  vars_files:
    - default.config.yml

  pre_tasks:
    - name: Include playbook configuration.
      include_vars: "{{ item }}"
      with_fileglob:
        - "{{ playbook_dir }}/config.yml"
      tags: ['always']

  roles:
    - role: elliotweiser.osx-command-line-tools

    - role: geerlingguy.mac.homebrew
      tags: ['homebrew']

    - role: geerlingguy.dotfiles
      when: configure_dotfiles
      tags: ['dotfiles']

    - role: gantsign.oh-my-zsh
      tags: ['dotfiles']
      oh_my_zsh_write_zshrc: false
      users:
        - username: 'schneider'

    - role: geerlingguy.mac.mas
      when: mas_installed_apps or mas_installed_app_ids
      tags: ['mas']

    - role: geerlingguy.mac.dock
      when: configure_dock
      tags: ['dock']

  tasks:
    - import_tasks: tasks/sudoers.yml
      when: configure_sudoers
      tags: ['sudoers']

    - import_tasks: tasks/terminal.yml
      when: configure_terminal
      tags: ['terminal']

    - import_tasks: tasks/karabiner.yml
      when: configure_karabiner
      tags: ['karabiner']

    - import_tasks: tasks/loosen-gatekeeper.yml
      when: configure_loosen_gatekeeper
      tags: ['loosen-gatekeeper']

    - import_tasks: tasks/osx.yml
      when: configure_osx
      tags: ['osx']

    - import_tasks: tasks/autostart.yml
      when: configure_autostart
      tags: ['autostart']

    - import_tasks: tasks/share-services.yml
      when: share_services_enabled or share_services_disabled
      tags: ['share-services']

    - import_tasks: tasks/display-resolution.yml
      when: configure_better_display_mode_number > 0
      tags: ['display-resolution']

    - import_tasks: tasks/maccy.yml
      when: configure_maccy
      tags: ['maccy']

    - import_tasks: tasks/default-browser-firefox.yml
      when: configure_firefox_as_default
      tags: ['default-browser']

    - import_tasks: tasks/extra-packages.yml
      tags: ['extra-packages']

    - import_tasks: tasks/sublime-text.yml
      when: configure_sublime
      tags: ['sublime-text']

    - name: Run post-provision task files in a block.
      tags: ['post']
      block:
        - name: Run configured post-provision ansible task files.
          include_tasks: "{{ outer_item }}"
          loop_control:
            loop_var: outer_item
          with_fileglob: "{{ post_provision_tasks | default(omit) }}"

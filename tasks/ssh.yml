---
# SSH Key Setup Task
#
# This task file:
# - Generates an Ed25519 SSH key pair with today's date in the filename
# - Creates symlinks to ~/.ssh/id_current and ~/.ssh/id_current.pub
# - Sets up SSH configuration to use the current key by default
# - Adds the key to ssh-agent and copies public key to clipboard (macOS)
#
# To regenerate a key, delete ~/.ssh/id_current and run again.

- name: Get git user email
  shell: git config user.email || echo "carlosaschjr@gmail.com"
  register: git_email
  changed_when: false
  failed_when: false

- name: Set SSH-related variables
  set_fact:
    ssh_email: "{{ git_email.stdout | trim }}"
    ssh_date: "{{ ansible_date_time.date | replace('-', '') }}"
    ssh_home: "{{ lookup('env', 'HOME') }}/.ssh"

- name: Set SSH key file paths
  set_fact:
    ssh_key_file: "{{ ssh_home }}/id_ed25519_{{ ssh_date }}"
    ssh_key_current: "{{ ssh_home }}/id_current"

- name: Ensure ~/.ssh directory exists with correct permissions
  ansible.builtin.file:
    path: "{{ ssh_home }}"
    state: directory
    mode: '0700'

- name: Ensure ~/.ssh/config.d directory exists
  ansible.builtin.file:
    path: "{{ ssh_home }}/config.d"
    state: directory
    mode: '0755'

- name: Check if current SSH key symlink exists
  stat:
    path: "{{ ssh_key_current }}"
  register: ssh_key_current_exists

- name: Check if today's SSH key already exists
  stat:
    path: "{{ ssh_key_file }}"
  register: ssh_key_today_exists

- name: Display key status
  debug:
    msg: |
      SSH key status:
      - Current key exists: {{ ssh_key_current_exists.stat.exists }}
      - Today's key exists: {{ ssh_key_today_exists.stat.exists }}
      - Will generate new key: {{ not ssh_key_current_exists.stat.exists }}

- name: Generate new SSH key pair
  openssh_keypair:
    path: "{{ ssh_key_file }}"
    type: ed25519
    comment: "{{ ssh_email }}_{{ ssh_date }}"
    mode: '0600'
    force: false
  register: ssh_keypair_result
  when: not ssh_key_current_exists.stat.exists and not ssh_key_today_exists.stat.exists

- name: Set correct permissions on generated public key
  file:
    path: "{{ ssh_key_file }}.pub"
    mode: '0644'
  when: ssh_keypair_result is changed

- name: Create symlink for current key pair
  when: not ssh_key_current_exists.stat.exists
  block:
    - file:
        src: "{{ ssh_key_file }}"
        dest: "{{ ssh_key_current }}"
        state: link
        force: true
    - file:
        src: "{{ ssh_key_file }}.pub"
        dest: "{{ ssh_key_current }}.pub"
        state: link
        force: true

- name: Create initial SSH config file
  copy:
    src: 'files/ssh/initial_config'
    dest: "{{ ssh_home }}/config"
    mode: '0644'
    force: no

- name: Install SSH config for using id_current by default
  copy:
    src: 'files/ssh/config.d/use_id_current_by_default'
    dest: "{{ ssh_home }}/config.d/use_id_current_by_default"
    mode: '0644'
    force: no

- name: Copy current public key to clipboard
  shell: pbcopy < "{{ ssh_key_current }}.pub"
  changed_when: false

- name: Display SSH key information
  when: ssh_keypair_result is changed
  debug:
    msg: |
      🔑 SSH Key Information:
      - Key file: {{ ssh_key_file }}
      - Symlink: {{ ssh_key_current }}
      - Email: {{ ssh_email }}
      - Date: {{ ssh_date }}

- name: Display setup completion message
  debug:
    msg:
      - "✅ SSH key setup complete!"
      - "🔗 Key available as: ~/.ssh/id_current"
      - "📄 Public key: pbcopy < ~/.ssh/id_current.pub"
      - ""
      - "➡️  Add your public key to these services:"
      - "    • GitHub:     https://github.com/settings/keys"
      - "    • GitLab:     https://gitlab.com/-/profile/keys"
      - "    • Bitbucket:  https://bitbucket.org/account/settings/ssh-keys/"
      - ""
      - "💡 To generate a new key, delete ~/.ssh/id_current and run again"

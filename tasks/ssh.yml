---
- name: Get git user email
  shell: git config user.email || echo "carlosaschjr@gmail.com"
  register: git_email
  changed_when: false

- name: Set email and date variables
  set_fact:
    ssh_email: "{{ git_email.stdout }}"
    ssh_date: "{{ ansible_date_time.date | replace('-', '') }}"
    ssh_key_file: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519_{{ ansible_date_time.date | replace('-', '') }}"
    ssh_key_current: "{{ lookup('env', 'HOME') }}/.ssh/id_current"

- name: Ensure ~/.ssh directory exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.ssh"
    state: directory
    mode: '0755'

- name: Ensure ~/.ssh/config.d directory exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.ssh/config.d/"
    state: directory
    mode: '0755'

- name: Check if SSH key id_current already exists
  stat:
    path: "{{ ssh_key_current }}"
  register: ssh_key_current_exists

- name: Check if SSH key already exists for today
  stat:
    path: "{{ ssh_key_file }}"
  register: ssh_key_exists

- name: Generate new SSH key if it doesn't exist
  openssh_keypair:
    path: "{{ ssh_key_file }}"
    type: ed25519
    comment: "{{ ssh_email }}_{{ ssh_date }}"
    force: false
  register: ssh_keypair_result
  when: not ssh_key_current_exists.stat.exists and not ssh_key_exists.stat.exists

- name: Create symlink for current private key
  file:
    src: "{{ ssh_key_file }}"
    dest: "{{ ssh_key_current }}"
    state: link
    force: yes
  when: not ssh_key_current_exists.stat.exists

- name: Create symlink for current public key
  file:
    src: "{{ ssh_key_file }}.pub"
    dest: "{{ lookup('env', 'HOME') }}/.ssh/id_current.pub"
    state: link
    force: yes
  when: not ssh_key_current_exists.stat.exists

- name: Create initial SSH Config file
  copy:
    src: 'files/ssh/initial_config'
    dest: '~/.ssh/config'
    force: no

- name: Use ~/.ssh/id_current key by default
  copy:
    src: 'files/ssh/config.d/use_id_current_by_default'
    dest: '~/.ssh/config.d/use_id_current_by_default'
    force: no

- name: Copy public key to clipboard (macOS)
  shell: pbcopy < "{{ lookup('env', 'HOME') }}/.ssh/id_current.pub"
  changed_when: false

- name: Display helpful information
  debug:
    msg:
      - "✅ SSH key setup complete!"
      - "✏️  Public key has been copied to clipboard."
      - "➡️  Add this key to your accounts"
      - "    • GitHub:     https://github.com/settings/keys"
      - "    • GitLab:     https://gitlab.com/-/profile/keys"
      - "    • Bitbucket:  https://bitbucket.org/account/settings/ssh-keys/"

- name: Flush dscacheutil if any name was changed
  command: dscacheutil -flushcache
  when:
    - configure_machine_name
    - (configure_machine_name != computer_name.stdout) or (configure_machine_name != host_name.stdout) or (configure_machine_name != local_host_name.stdout)

---
- name: Get Gatekeeper status
  ansible.builtin.shell: spctl --disable-status
  register: assessments_status
  changed_when: false

- name: Debug Gatekeeper status
  ansible.builtin.debug:
    var: assessments_status.stdout

- name: Enable Apps from "Anywhere" on the system settings
  when: "'is currently not available' in assessments_status.stdout"
  ansible.builtin.command: spctl --master-disable
  register: disable_result
  failed_when: "'needs to be confirmed in System Settings' not in disable_result.stderr"
  ignore_errors: true
  become: true


# This just includes the "Anywhere" option under **Settings > Privacy & Security > Allow apps downloaded from**.
# It's up to you to enable it.
#
# You can revert this with
# sudo spctl --master-enable

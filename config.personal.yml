  - maccy
  - alt-tab
  - tabby
  - font-fira-code-nerd-font
  - karabiner-elements
  - firefox
  - google-chrome
  - visual-studio-code
  - docker
  - sequel-ace
  - rustdesk
  - vlc
  - spotify
  - logi-options-plus
  - rectangle
  - obsidian
  - handbrake
  - mos
  - bruno
  - keka
  - whatsapp
  - betterdisplay
  # - sublime-text
homebrew_cask_uninstalled_apps:
  - bitwarden
  - only-switch
  # - chromedriver
  # - dropbox
  # - licecap
  # - slack
  # - transmit
  # - audacity # ?
  # - obs-studio # ?

# See `geerlingguy.mac.mas` role documentation for usage instructions.
mas_email: "apple@carlosasj.dev"
# mas_password: ""
# mas_signin_dialog: true
mas_installed_apps:
  - { id: 1352778147, name: "Bitwarden" } # This one supports fingerprint use on other browsers
  - { id: 937984704, name: "Amphetamine: keep-awake utility" }
  - { id: 1586435171, name: "Actions: Useful for Shortcuts" }
  - { id: 1351639930, name: "Gifski: Convert videos to quality GIFs" }
  - { id: 6450279539, name: "Second Clock: on the menu bar" }
  - { id: 1604176982, name: "One Thing" }
  - { id: 1444636541, name: "Photomator – Photo Editor" }
  - { id: 1355679052, name: "Dropover: Easier Drag & Drop" }


osx_script: "~/.osx --no-restart"

# Install packages from other package managers.
# Note: You are responsible for making sure the required package managers are
# installed, eg. through homebrew.
composer_packages: []
# - name: drush
#   state: present # present/absent, default: present
#   version: "^8.1" # default: N/A
gem_packages: []
# - name: bundler
#   state: present # present/absent/latest, default: present
#   version: "~> 1.15.1" # default: N/A
npm_packages: []
# - name: webpack
#   state: present # present/absent/latest, default: present
#   version: "^2.6" # default: N/A
pip_packages: []
# - name: mkdocs
#   state: present # present/absent/latest, default: present
#   version: "0.16.3" # default: N/A

# Set to 'true' to configure Sublime Text.
configure_sublime: false
sublime_base_path: "~/Library/Application Support/Sublime Text"
sublime_config_path: "Packages/User"

---
configure_dotfiles: true
configure_terminal: true
configure_karabiner: true
configure_osx: true

# Set to 'true' to configure the Dock via dockutil.
configure_dock: true

dockitems_remove:
  # - Launchpad
  - Safari
  - Messages
  - Mail
  - Maps
  - Photos
  - FaceTime
  - Calendar
  - Contacts
  # - Reminders
  - Notes
  - Freeform
  - TV
  - Music
  - Keynote
  - Numbers
  - Pages
  - 'App Store'
  - Podcasts

# Keep `pos` ordered.
# Name is just a helper when the script is running
dockitems_to_persist:
  - name: Launchpad
    path: "/Applications/Launchpad.app"
    pos: 1
  - name: Firefox
    path: "/Applications/Firefox.app"
    pos: 2
  - name: VSCode
    path: "/Applications/Visual Studio Code.app"
    pos: 3


configure_sudoers: false
sudoers_custom_config: ""
# Example:
# sudoers_custom_config: |
#   # Allow users in admin group to use sudo with no password.
#   %admin ALL=(ALL) NOPASSWD: ALL

# dotfiles_repo: https://github.com/geerlingguy/dotfiles.git
dotfiles_repo: https://github.com/carlosasj/.dotfiles
dotfiles_repo_accept_hostkey: true
dotfiles_repo_local_destination: ~/git/.dotfiles
dotfiles_repo_version: master # Replace with your default branch
dotfiles_files:
  - .aliases
  - .bashrc
  - .gitconfig
  - .gitignore_global
  # - .inputrc
  - .load_homebrew
  - .load_nvm
  - .load_pyenv
  - .load_sdkman
  - .load_tabby
  - .osx
  - .profile
  - .vimrc
  - .zshrc

homebrew_installed_packages:
  # - ansible # Installed via Pip.
  # - autoconf
  - bash-completion
  - gettext
  - git
  - go
  - gpg
  - jq
  # - nmap
  # - node
  # - nvm
  - openssl
  - wget
  - zsh-history-substring-search
# homebrew_uninstalled_packages:
  # - doxygen
  # - gifsicle
  # - gh
  # - httpie
  # - iperf
  # # - libevent
  # # - sqlite
  # - php
  # - pngpaste
  # - ssh-copy-id
  # # - readline
  # - pv
  # - wrk

homebrew_taps: []

homebrew_cask_appdir: /Applications
homebrew_cask_apps:
